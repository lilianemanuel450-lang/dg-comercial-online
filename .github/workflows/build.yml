name: Build APK

on:
  push:
    branches: [ main, angoshopping-dev ]
  pull_request:
    branches: [ main, angoshopping-dev ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Gerar projeto nativo Android (se ainda não existir)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name dg_comercial_online --org com.dgcomercial .
          fi

      - name: Instalar dependências
        run: flutter pub get

      - name: Analisar código
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Rodar testes
        run: flutter test
        continue-on-error: true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: dg-comercial-online-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
